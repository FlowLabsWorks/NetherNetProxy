<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>NetherNetProxy</title>
  <desc>Join NetherNet-only Minecraft Bedrock servers from Xbox, PlayStation and Switch through the LAN list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#16202e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="640" fill="#3fb950"/>

  <text x="80" y="170" font-size="84" font-weight="700" fill="#f0f6fc">NetherNetProxy</text>
  <text x="84" y="232" font-size="34" fill="#9fb3c8">Join NetherNet-only Minecraft Bedrock servers</text>
  <text x="84" y="278" font-size="34" fill="#9fb3c8">from Xbox, PlayStation and Switch &#8211; via the LAN list</text>

  <g font-size="26" fill="#f0f6fc" text-anchor="middle">
    <rect x="80" y="380" width="260" height="110" rx="14" fill="#1f2a3a" stroke="#3a4a60" stroke-width="2"/>
    <text x="210" y="428">Console</text>
    <text x="210" y="464" font-size="17" fill="#9fb3c8">Xbox &#183; PlayStation &#183; Switch</text>

    <rect x="510" y="380" width="260" height="110" rx="14" fill="#1f2a3a" stroke="#3fb950" stroke-width="3"/>
    <text x="640" y="428">NetherNetProxy</text>
    <text x="640" y="464" font-size="20" fill="#9fb3c8">LAN world &#8594; Transfer</text>

    <rect x="940" y="380" width="260" height="110" rx="14" fill="#1f2a3a" stroke="#3a4a60" stroke-width="2"/>
    <text x="1070" y="428">Your server</text>
    <text x="1070" y="464" font-size="20" fill="#9fb3c8">online-mode stays on</text>
  </g>

  <g stroke="#58a6ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M345 420 H500"/>
    <path d="M500 470 H345"/>
    <path d="M210 495 V545 Q210 575 240 575 H1040 Q1070 575 1070 545 V497" stroke-linejoin="round"/>
  </g>
  <g font-size="19" fill="#9fb3c8" text-anchor="middle">
    <text x="422" y="408">1 LAN join</text>
    <text x="422" y="494">2 Transfer</text>
    <text x="640" y="608">3 join with its own account</text>
  </g>
</svg>
