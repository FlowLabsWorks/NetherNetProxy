name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the README (**Status and limitations**) and the existing
        issues first. Remove host names or addresses you do not want to publish.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what is missing today, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Console / device this is about
      options: [Xbox, PlayStation, Nintendo Switch, Windows, Android / iOS, Not platform specific]
    validations:
      required: false
